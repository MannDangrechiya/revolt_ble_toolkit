name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # softprops/action-gh-release needs this to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Attach build artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Not wired up: publishing to PyPI. That needs either a PyPI API token
      # stored as a repo secret, or PyPI Trusted Publishing configured on
      # PyPI's side for this repo — neither exists yet. Add a
      # `pypa/gh-action-pypi-publish` step here once one of those is set up.
