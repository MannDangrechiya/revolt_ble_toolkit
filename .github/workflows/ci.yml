name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Intentionally shallow (default fetch-depth: 1) — scans only the
      # commit(s) in this push/PR, not the whole repo history. The known,
      # already-tracked incident predating this tool lives in git history
      # (see HISTORY_SANITIZATION.md) and isn't this check's job to re-flag
      # on every run; this check's job is catching new secrets going forward.
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6's offscreen QPA platform still needs these shared libs present
      # on a bare Ubuntu runner, even with no real display involved.
      - name: Install Qt runtime libraries (for headless PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package
        run: pip install -e ".[dev,gui,live]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
