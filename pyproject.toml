[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "revolt-ble-toolkit"
version = "1.0.0"
description = "A professional toolkit for reverse engineering Bluetooth Low Energy traffic captured in Android HCI Snoop Logs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kunj", email = "kunj@printdeed.com" }]
keywords = ["bluetooth", "ble", "hci", "snoop-log", "reverse-engineering", "android"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

# Runtime dependencies: none yet. The foundation is stdlib-only; parsing,
# analysis, and export dependencies will be added as those modules land.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]
gui = [
    "PySide6>=6.7.0",
]
live = [
    "bleak>=0.22",
]

[project.scripts]
revolt-ble-toolkit = "revolt_ble_toolkit.cli.main:main"
revolt-ble-gui = "revolt_ble_toolkit.gui.app:main"
revolt-ble-live = "revolt_ble_toolkit.live.cli:main"

[project.urls]
Repository = "https://github.com/MannDangrechiya/revolt_ble_toolkit"
Issues = "https://github.com/MannDangrechiya/revolt_ble_toolkit/issues"
Changelog = "https://github.com/MannDangrechiya/revolt_ble_toolkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/revolt_ble_toolkit"]

# --- uv -----------------------------------------------------------------

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

# --- Ruff (lint + import sort) -------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["revolt_ble_toolkit"]

[tool.ruff.lint.per-file-ignores]
# Qt requires overriding its camelCase virtual methods (rowCount, paintEvent,
# dragEnterEvent, ...) verbatim; they can't be renamed to snake_case.
"src/revolt_ble_toolkit/gui/*.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"

# --- Black (formatter) ----------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]

# --- Mypy (static typing) --------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=revolt_ble_toolkit --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
